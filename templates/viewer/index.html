<!doctype html>
<!--
   Docsify viewer for a Leji context layer. Docsify (v4.13.1), its theme, and the
   search + sidebar-collapse plugins are vendored locally under assets/
   and written alongside this file by `leji viewer`; nothing is loaded from a remote
   CDN. The layer name and homepage are injected by the SDK as a JSON config blob
   (not interpolated into JS source), so a layer name can never break out of the
   script context.
-->
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <!--
         Strict CSP: scripts load only from this origin (vendored Docsify core,
         plugins, and viewer-boot.js), so a <script> or inline handler injected
         through a served Markdown document cannot execute. The layer config is a
         JSON data block, not executable script. Styles allow 'unsafe-inline' because
         Docsify sets element styles at runtime; that is not a script-execution path.
         frame-src 'none' closes the framing path: without it a governed document
         could frame a same-origin /content/ page, which inherits none of this.
         The directive naming who may frame this page is deliberately absent: a meta
         policy cannot deliver it, so claiming it here would protect nothing and cost
         an ignored-directive console error on every page. The local server sends
         this policy as a response header on every response, with that directive
         added, so the served viewer is covered including documents fetched outside
         this shell; a static host serving an export sets it in its own headers.
      -->
      <meta
         http-equiv="Content-Security-Policy"
         content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'"
      />
      <title>{{LEJI_NAME_HTML}}</title>
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta name="color-scheme" content="light dark" />
      <link rel="icon" href="{{FAVICON_URL}}" />
      <!-- The theme bootstrap runs before any body paint (and before the theme
           stylesheet loads), so the effective theme is on <html data-theme> by
           the time the page renders: no flash of the wrong theme for a dark
           reader or for a reader with a saved choice. Same-origin, so it clears
           the strict CSP's script-src 'self'. -->
      <script src="assets/theme-init.js"></script>
      <link rel="stylesheet" href="assets/vue.css" />
      <link rel="stylesheet" href="assets/docsify-sidebar-collapse.min.css" />
      <style>
         /* Viewer default styling: the reading surface for content, the brand
            canvas on the sidebar and its chrome, tight nesting — the shape teams
            hand-build for internal dashboards. Accents ride --theme-color (set by
            Docsify from viewer.theme.primary); the text tones are the --leji-text*
            custom properties assets/vue.css declares, which loads before this
            block, and dark mode re-values those same tokens in vue.css's
            prefers-color-scheme block, so every rule here that names a token
            reads correctly in both modes. */
         body {
            background-color: var(--leji-content);
         }

         /* Classification chip: top-right corner, the page's category (+ record
            date) as agents see it. */
         .lj-cat {
            position: fixed;
            top: 12px;
            right: 16px;
            z-index: 5;
            font-size: 0.7rem;
            letter-spacing: 0.02em;
            color: var(--leji-text-body);
            background: var(--leji-paper);
            border: 1px solid var(--leji-line);
            border-radius: 999px;
            padding: 3px 10px;
            user-select: none;
         }

         /* Light sidebar */
         .sidebar {
            background-color: var(--leji-paper);
            border-right: 1px solid var(--leji-line);
         }
         /* Loading state while the served sidebar is being generated: the CSS
            :empty rule paints instantly (before any script runs); the boot
            script's placeholder covers browsers/DOM states :empty misses.
            Both vanish when Docsify writes the compiled nav. */
         .sidebar-nav:empty::before,
         .sidebar-nav .lj-nav-loading {
            content: 'Loading navigation…';
            /* Centered in the sidebar panel, vertically and horizontally: the
               placeholder positions against .sidebar (the nearest positioned
               ancestor, position: fixed). */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
            padding: 0;
            width: max-content;
            text-align: center;
            font-size: 0.8rem;
            color: var(--leji-text-body);
            animation: lj-nav-pulse 1.2s ease-in-out infinite;
         }
         @keyframes lj-nav-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
         }
         .sidebar-nav li {
            list-style: none;
         }
         .sidebar-nav li::before {
            content: none !important;
         }
         .sidebar-nav li > a {
            color: var(--leji-text);
            padding: 6px 0;
         }
         .sidebar-nav li > a:hover {
            color: var(--theme-color, #009f71);
         }

         /* Top-level links (boot profile, pins) */
         .sidebar-nav > ul > li > a {
            font-weight: 500;
            font-size: 15px;
            padding: 4px 0;
         }

         /* Metadata header tables (`| | |` convention): hide the empty header
            row instead of rendering blank cells. */
         .markdown-section th:empty {
            padding: 0;
            border: 0;
            height: 0;
            line-height: 0;
            font-size: 0;
         }
         .markdown-section thead:has(th:empty) {
            display: none;
         }
         .markdown-section thead:has(th:empty) + tbody tr:first-child {
            border-top: 0;
         }

         /* Sidebar bold rides the 600 face: Source Sans Pro ships 300/400/600,
            so a 500 here would resolve down to the regular 400 face. */
         .sidebar li > p {
            font-weight: 600;
         }
         .sidebar ul li.active > a {
            font-weight: 600 !important;
         }

         /* Group headers: the theme's default bold rendering, at full size. */
         .sidebar-nav li > strong,
         .sidebar-nav li > p > strong {
            color: var(--leji-text);
            font-weight: 600;
            user-select: none;
         }

         /* Sidebar collapse: small triangles, pinned to the label's first line
            (never centered against the whole li, which drifts on expand). */
         .sidebar-nav li.folder::before {
            content: "▶" !important;
            border: none !important;
            height: auto !important;
            width: auto !important;
            transform: none !important;
            font-size: 8px;
            line-height: 1;
            color: var(--leji-caret);
            top: 0.9em;
            margin-top: 0;
            left: -4px;
            transition: none !important;
         }
         .sidebar-nav li.folder.open:not(.collapse)::before {
            content: "▼" !important;
         }
         .sidebar-nav li.folder.collapse::before {
            content: "▶" !important;
         }
         .sidebar-nav > ul {
            padding-left: 12px;
         }
         .sidebar-nav > ul > li {
            margin-top: 2px;
         }
         .sidebar-nav ul ul {
            padding-left: 12px;
         }
         .sidebar-nav ul ul li {
            margin: 0;
            padding: 0;
         }
         .sidebar-nav ul ul li > a {
            font-size: 14px;
            color: var(--leji-text-body);
            padding: 2px 0;
         }
         .sidebar-nav ul ul li > a:hover {
            color: var(--theme-color, #009f71);
            transition: color 0.2s ease;
         }

         /* Divider between sidebar zones */
         .sidebar-nav hr {
            margin: 16px 0;
            border: none;
            border-top: 1px solid var(--leji-line);
         }

         /* Search */
         .search input {
            background-color: var(--leji-content);
            border: 1px solid var(--leji-line);
            color: var(--leji-text-body);
         }
         .search .results-panel {
            background-color: var(--leji-content);
            border: 1px solid var(--leji-line);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
         }
         .search .results-panel .matching-post > a {
            color: var(--leji-text);
         }
         .search .results-panel .matching-post > a:hover {
            color: var(--theme-color, #009f71);
         }
         .matching-post {
            border-bottom: 1px solid var(--leji-line);
         }

         /* App name / logo block */
         .sidebar .app-name {
            text-align: left;
            margin: 0 0 16px 27px;
            padding: 0;
         }
         .sidebar .app-name-link {
            display: inline-block;
         }
         .sidebar {
            padding-bottom: 0;
         }

         /* Powered-by mark: lower-right corner, out of the way. The overrides
            neutralize the theme stylesheet's older bar treatment. The Leji link
            keeps the Leji link green whatever the layer's own accent is. */
         .leji-powered {
            position: fixed;
            left: auto;
            right: 14px;
            bottom: 10px;
            padding: 0;
            background: transparent;
            border-top: none;
            font-size: 11px;
            letter-spacing: normal;
            text-transform: none;
            color: var(--leji-text-body);
            z-index: 30;
         }
         .leji-powered a {
            color: var(--leji-link, #007d59);
            text-decoration: none;
         }
         .leji-powered a:hover {
            color: var(--leji-deep);
         }

         /* The powered-by hover deepens on light, but on the dark canvas the deep
            green reads as black-on-dark; the theme's own dark re-value cannot reach
            this rule (--leji-deep is deliberately unchanged), so it is re-stated
            for dark here, keyed off the effective theme the boot script writes to
            <html data-theme>. !important matches the theme's own rule so the dark
            state actually wins. */
         :root[data-theme='dark'] .leji-powered a:hover {
            color: var(--leji-text) !important;
         }

         /* Theme toggle: a fixed pill in the lower-right corner, above the
            powered-by mark. The boot script injects the element, cycles the
            system|light|dark choice, and persists it; this block only styles it,
            through the same tokens every surface uses, so it follows the theme. */
         .leji-theme {
            position: fixed;
            right: 14px;
            bottom: 42px;
            z-index: 40;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 4px 11px;
            font-family: 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 0.02em;
            color: var(--leji-text-body);
            background: var(--leji-paper);
            border: 1px solid var(--leji-line);
            border-radius: 999px;
            cursor: pointer;
            user-select: none;
         }
         .leji-theme:hover {
            color: var(--theme-color, #009f71);
            border-color: var(--theme-color, #009f71);
         }
         .leji-theme:focus-visible {
            outline: 2px solid var(--theme-color, #009f71);
            outline-offset: 2px;
         }
      </style>
   </head>
   <body>
      <div id="app">Loading the context layer…</div>
      <script id="leji-docsify-config" type="application/json">
         {{DOCSIFY_CONFIG}}
      </script>
      <script src="assets/viewer-boot.js"></script>
      <script src="assets/docsify.min.js"></script>
      <script src="assets/prism-bash.min.js"></script>
      <script src="assets/prism-json.min.js"></script>
      <script src="assets/prism-typescript.min.js"></script>
      <script src="assets/prism-markdown.min.js"></script>
      <script src="assets/search.min.js"></script>
      <script src="assets/docsify-sidebar-collapse.min.js"></script>
      <script src="assets/docsify-copy-code.min.js"></script>
      <script src="assets/zoom-image.min.js"></script>{{MERMAID_SCRIPTS}}
   </body>
</html>
