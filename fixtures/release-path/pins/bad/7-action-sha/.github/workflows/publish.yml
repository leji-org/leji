name: Publish action drifted
# Rule 7: a 40-character SHA that rule 4 accepts, but not the SHA the pin tuple
# names. The comment still says the pinned version, which is exactly how an
# action bump leaves the local twine gate standing in for the wrong upload.

on: [push]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.14.2
        with:
          packages-dir: dist
