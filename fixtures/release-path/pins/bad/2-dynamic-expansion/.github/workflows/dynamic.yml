name: Install from a variable
# Rule 2: the requirement is decided at runtime, so no reader of this file can
# say what gets installed. Exactly pinned is a property of the text, not of a run.

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install "$PACKAGE"
