name: npx from a variable
# Rule 8: npx fetches what the expansion names. There is no local-artifact case
# for it, so there is no exception either.

on: [push]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx "$PACKAGE" publish
