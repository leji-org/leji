name: Floating tag
# Rule 1: the regression this whole gate exists for, a tool taken at @latest.
# Whatever installs it, the tag is the defect.

on: [push]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
