name: Go minor line
# Rule 5: a go-version without a patch component resolves to whatever the
# runner's toolchain has cached that week.

on: [push]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
