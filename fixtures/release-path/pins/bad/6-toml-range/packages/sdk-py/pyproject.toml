# Rule 6: a dev extra left as a range. The build requirements are exact, so the
# fixture trips one rule and only one.

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "bad"
version = "0.0.0"
dependencies = [
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
]
