# Exact build requirements and dev extras; runtime dependencies stay ranges
# (library etiquette on PyPI), which rule 6 must not object to.

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "good"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18,<5",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "coverage==7.16.1",
    "build==1.6.1",
]
