name: Good
# Every shape the checker must accept: SHA-pinned actions with their version
# comment, a patch-level go-version, an exact global npm install, an exact npx
# package, an exact action version input, exact pip requirements, the option
# forms that carry no version at all, a trailing comment on an install line, and
# a whole-line comment that names an unpinned install without performing one.

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - run: npm install -g npm@12.0.2 && npm --version
      - run: npx --yes jsr@0.14.3 publish --dry-run
      - name: Install
        working-directory: packages/sdk-py
        run: |
          # A comment may say pip install build or npm install -g npm@latest:
          # it installs nothing, so it is not a violation.
          python -m pip install pip==26.2.1
          pip install -e ".[dev]"
          pip install build==1.5.0 # the same build the workflow pins
      - name: Build binaries
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.18.0"
          args: release --clean
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/sdk-py/dist
