name: Release

# Tag-driven, OIDC-published multi-registry release. Per-package path-prefixed
# tags; each triggers only its own publish job:
#
#   packages/sdk/v*          -> npm `@leji-org/leji` + JSR `@leji-org/leji`
#   packages/create-leji/v*  -> npm `create-leji`
#   packages/sdk-py/v*       -> PyPI `leji`
#   packages/sdk-go/v*       -> Go module index + goreleaser binaries (DRAFT)
#   packages/mcp/v*          -> npm `@leji-org/mcp`  (tag after packages/sdk/v* is live)
#
# Trusted publishers must be configured on each registry before tagging.
# Actions pinned to full commit SHAs for supply-chain hardening.

on:
  push:
    tags:
      - "packages/sdk/v*"
      - "packages/create-leji/v*"
      - "packages/sdk-py/v*"
      - "packages/sdk-go/v*"
      - "packages/mcp/v*"

permissions:
  contents: read

jobs:
  # The version the tag names, for the checks below to hold every package to.
  # Each release tag carries the same shape, so one expression serves all five.
  version:
    name: Release version (from the tag)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - id: read
        run: echo "version=${GITHUB_REF_NAME##*/v}" >> "$GITHUB_OUTPUT"

  # Pre-publish gate on EVERY release tag: the pre-publish smoke, the version
  # comparison across all five packages, the Python distribution gate, and the
  # cross-platform Go build. CI runs this same reusable workflow on every pull
  # request and, in full, on every `rc/*` candidate, so what happens here is a
  # recheck on the exact tagged bytes rather than the first time these checks
  # meet a runner. Every job below it does nothing but write.
  checks:
    name: Release checks
    needs: version
    uses: ./.github/workflows/release-checks.yml
    with:
      version: ${{ needs.version.outputs.version }}
      docker_required: true
      full: true

  # --- packages/sdk/v* : npm `@leji-org/leji` + JSR `@leji-org/leji` (same tag, two jobs) ---

  npm:
    name: Publish leji to npm
    if: startsWith(github.ref, 'refs/tags/packages/sdk/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing (provenance automatic, no token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # OIDC trusted publishing needs npm >= 11.5.1 (Node 24 may ship older).
      # The version is the tuple's, so bumping it is one edit in one file.
      - name: Install the publish npm (scripts/release-pins.env)
        run: |
          set -euo pipefail
          . scripts/lib/release-pins.sh
          load_release_pins scripts/release-pins.env
          npm install -g "npm@${NPM_VERSION}"
          npm --version
      - run: npm ci
      - run: npm run assets:check
      - run: npm run build -w packages/sdk
      - run: npm test -w packages/sdk
      # OIDC trusted publishing: no stored token, provenance automatic.
      - name: Publish (OIDC trusted publishing)
        working-directory: packages/sdk
        run: npm publish --access public

  jsr:
    name: Publish @leji-org/leji to JSR (OIDC)
    if: startsWith(github.ref, 'refs/tags/packages/sdk/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR OIDC publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      # JSR publishes the TS source (per jsr.json), not the npm dist tarball.
      # The jsr CLI is pinned like every other tool on this path; the version
      # mirrors JSR_VERSION in scripts/release-pins.env.
      - name: Publish to JSR
        working-directory: packages/sdk
        run: npx jsr@0.14.3 publish

  # --- packages/create-leji/v* : npm `create-leji` (first-class, own tag) ---

  create-leji:
    name: Publish create-leji to npm
    if: startsWith(github.ref, 'refs/tags/packages/create-leji/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing (provenance automatic, no token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # The publish npm, from the tuple (see the sdk job above).
      - name: Install the publish npm (scripts/release-pins.env)
        run: |
          set -euo pipefail
          . scripts/lib/release-pins.sh
          load_release_pins scripts/release-pins.env
          npm install -g "npm@${NPM_VERSION}"
          npm --version
      - run: npm ci
      # Tag AFTER packages/sdk/v* is live so the @leji-org/leji dep resolves.
      - name: Publish (OIDC trusted publishing)
        working-directory: packages/create-leji
        run: npm publish --access public

  # --- packages/mcp/v* : npm `@leji-org/mcp` ---

  npm-mcp:
    name: Publish @leji-org/mcp to npm
    if: startsWith(github.ref, 'refs/tags/packages/mcp/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing (provenance automatic, no token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # The publish npm, from the tuple (see the sdk job above).
      - name: Install the publish npm (scripts/release-pins.env)
        run: |
          set -euo pipefail
          . scripts/lib/release-pins.sh
          load_release_pins scripts/release-pins.env
          npm install -g "npm@${NPM_VERSION}"
          npm --version
      - run: npm ci
      - run: npm run assets:check
      - run: npm run build -w packages/sdk
      - run: npm run build -w packages/mcp
      - run: npm test -w packages/mcp
      # Tag AFTER packages/sdk/v* is live (MCP depends on @leji-org/leji).
      - name: Publish (OIDC trusted publishing)
        working-directory: packages/mcp
        run: npm publish --access public

  # --- packages/sdk-py/v* : PyPI `leji` ---

  pypi:
    name: Publish leji to PyPI (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/packages/sdk-py/v')
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test
        working-directory: packages/sdk-py
        run: python -m pip install pip==26.2.1 && pip install -e ".[dev]" && pytest -q
      - name: Build sdist + wheel
        working-directory: packages/sdk-py
        run: python -m pip install build==1.5.0 && python -m build
      # The last gate before the irreversible act, on the exact bytes about to be
      # uploaded: the publish action rejects a distribution twine cannot render,
      # and it rejects it after the tag exists. Same function as the smoke and
      # the pre-push hook, same twine the action below bundles.
      - name: twine check --strict on the built distribution
        run: |
          . scripts/lib/twine-check.sh
          twine_check python3 packages/sdk-py "$RUNNER_TEMP/twine-gate" packages/sdk-py/dist
      # SHA, version comment, and the twine the gate above installs all come from
      # scripts/release-pins.env; moving this pin means moving that file.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/sdk-py/dist

  # --- packages/sdk-go/v* : Go module index + goreleaser binaries (DRAFT) ---

  go:
    name: Release Go binaries (goreleaser, draft)
    if: startsWith(github.ref, 'refs/tags/packages/sdk-go/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the DRAFT GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so goreleaser sees tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: packages/sdk-go/go.sum
      # goreleaser can't parse the path-prefixed tag as a version, so create a
      # LOCAL bare tag for the run (never pushed; no repo-wide vX.Y.Z ref).
      - name: Prepare goreleaser version tag (local only)
        run: |
          VERSION="${GITHUB_REF_NAME#packages/sdk-go/v}"
          git tag "v$VERSION"
          echo "GORELEASER_CURRENT_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "LEJI_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build cross-platform binaries (goreleaser, no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # The action is pinned by SHA; this input pins the goreleaser it
          # installs, and mirrors GORELEASER_VERSION in scripts/release-pins.env.
          version: "v2.18.0"
          workdir: packages/sdk-go
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # DRAFT release on the path-prefixed tag; the finalize step publishes it.
      - name: Draft GitHub Release on the path-prefixed tag with the binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            packages/sdk-go/dist/leji_*.tar.gz \
            packages/sdk-go/dist/leji_*.zip \
            packages/sdk-go/dist/checksums.txt \
            --draft --title "Leji v$LEJI_VERSION" \
            --notes "Leji v$LEJI_VERSION. Cross-platform leji binaries; see https://leji.org."
